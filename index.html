<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="img/favicon.png">
    <title>To-Do List</title>
</head>
<body>
    <main>
        <h1>TO-DO LIST</h1>
        <div class="topicos">
            <div class="esquerda">
                <div class="opcoes">
                    <h2>O QUE DESEJA FAZER?</h2>

                    <div class="caixa_form_cad">
                        <h3 id="cadastrar_tarefa">CADASTRAR NOVA TAREFA</h3>
                        
                        <div class="caixa_form_cadastrar">
                            <form class="formulario_cadastrar">
                                <div>
                                    <label for="tituloCadastrar">TÍTULO</label><br>
                                    <input type="text" id="tituloCadastrar" name="titulo" placeholder="Título da tarefa" required>
                                </div>
                                <div>
                                    <label for="descricaoCadastrar">DESCRIÇÃO</label><br>
                                    <input type="text" id="descricaoCadastrar" name="descricao" placeholder="Descrição da tarefa" required>
                                </div>
                                <div>
                                    <label for="prioridadeCadastrar">PRIORIDADE</label><br>
                                    <select id="prioridadeCadastrar" name="prioridade">
                                        <option value="baixa">Baixa</option>
                                        <option value="media">Média</option>
                                        <option value="alta">Alta</option>
                                    </select>
                                </div>
                                <button type="submit" class="botao_form">CADASTRAR</button>
                            </form>
                        </div>
                    </div>
                    
                    <h3 id="visualizar_tarefas">VISUALIZAR TAREFAS</h3>
                    
                    <div class="caixa_form_ed">
                        <h3 id="editar_tarefas">EDITAR TAREFAS</h3>

                        <div class="caixa_form_editar">
                            <form class="formulario_editar">
                                <div>
                                    <label for=>EDITAR A TAREFA:</label>
                                    <select id="opcaoTarefasEditar"></select>
                                </div>
                                <div>
                                    <label for="tituloEditar">TÍTULO</label><br>
                                    <input type="text" id="tituloEditar" name="titulo" placeholder="Título da tarefa" required>
                                </div>
                                <div>
                                    <label for="descricaoEditar">DESCRIÇÃO</label><br>
                                    <input type="text" id="descricaoEditar" name="descricao" placeholder="Descrição da tarefa" required>
                                </div>
                                <div>
                                    <label for="prioridadeEditar">PRIORIDADE</label><br>
                                    <select id="prioridadeEditar" name="prioridade">
                                        <option value="baixa">Baixa</option>
                                        <option value="media">Média</option>
                                        <option value="alta">Alta</option>
                                    </select>
                                </div>
                                <button type="submit" class="botao_form">ATUALIZAR</button>
                            </form>
                        </div>
                    </div>
                    
                    <div class="caixa_form_ex">
                        <h3 id="excluir_tarefas">EXCLUIR TAREFAS</h3>
                        
                        <div class="caixa_form_excluir">
                            <form class="formulario_excluir">
                                <div>
                                    <label for="tituloExcluir">TÍTULO</label><br>
                                    <input type="text" id="tituloExcluir" name="titulo" placeholder="Título da tarefa" required>
                                </div>
                                <div>
                                    <label for="descricaoExcluir">DESCRIÇÃO</label><br>
                                    <input type="text" id="descricaoExcluir" name="descricao" placeholder="Descrição da tarefa" required>
                                </div>
                                <div>
                                    <label for="prioridadeExcluir">PRIORIDADE</label><br>
                                    <select id="prioridadeExcluir" name="prioridade">
                                        <option value="baixa">Baixa</option>
                                        <option value="media">Média</option>
                                        <option value="alta">Alta</option>
                                    </select>
                                </div>
                                <button type="submit" class="botao_form">EXCLUIR</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="direita">
                <h2>TAREFAS ATUAIS</h2>
                <div id="agenda">
                    <div id="tarefas_atuais">
                        
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
