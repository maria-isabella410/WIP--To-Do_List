<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="img/favicon.png">
    <title>To-Do List</title>
</head>
<body>
    <main>
        <h1>TO-DO LIST</h1>
        <div id="topicos">
            <div id="esquerda">
                <div class="opcoes">
                    <h2>O QUE DESEJA FAZER?</h2>
                    <h3>CADASTRAR NOVA TAREFA</h3>
                    <h3>VISUALIZAR TAREFAS</h3>
                    <h3>EDITAR TAREFAS</h3>
                    <h3>EXCLUIR TAREFAS</h3>
                </div>

                <form action="" class="formulario">
                    <div>
                        <label for="">TÍTULO</label>
                        <input type="text" id="titulo" name="titulo" placeholder="Título da tarefa" required>
                    </div>
                    <div>
                        <label for="">DESCRIÇÃO</label>
                        <input type="text" id="descricao" name="descricao" placeholder="Descrição da tarefa" required>
                    </div>
                    <div>
                        <label for="">PRIORIDADE</label>
                        <select id="prioridade" name="prioridade">
                            <option value="baixa">Baixa</option>
                            <option value="media">Média</option>
                            <option value="alta">Alta</option>
                        </select>
                    </div>
                    <button type="submit" class="botao_form">CADASTRAR</button>
                </form>
            </div>
            <div id="direita">
                <h2>TAREFAS ATUAIS</h2>
                <div class="tarefas_atuais">

                </div>
            </div>
        </div>
    </main>
</body>
</html>
