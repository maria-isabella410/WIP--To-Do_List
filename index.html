<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="img/favicon.png">
    <title>To-Do List</title>
</head>
<body>
    <main>
        <h1>TO-DO LIST</h1>
        <div class="topicos">
            <div class="esquerda">
                <div class="opcoes">
                    <h2>O QUE DESEJA FAZER?</h2>
                    <h3 id="cadastrar_tarefa">CADASTRAR NOVA TAREFA</h3>
                    <h3 id="visualizar_tarefas">VISUALIZAR TAREFAS</h3>
                    <h3 id="editar_tarefas">EDITAR TAREFAS</h3>
                    <h3 id="excluir_tarefas">EXCLUIR TAREFAS</h3>
                </div>

                <form action="" method="" class="formulario">
                    <div>
                        <label for="titulo">TÍTULO</label><br>
                        <input type="text" id="titulo" name="titulo" placeholder="Título da tarefa" required>
                    </div>
                    <div>
                        <label for="descricao">DESCRIÇÃO</label><br>
                        <input type="text" id="descricao" name="descricao" placeholder="Descrição da tarefa" required>
                    </div>
                    <div>
                        <label for="prioridade">PRIORIDADE</label><br>
                        <select id="prioridade" name="prioridade">
                            <option value="baixa">Baixa</option>
                            <option value="media">Média</option>
                            <option value="alta">Alta</option>
                        </select>
                    </div>
                    <button type="submit" class="botao_form">CADASTRAR</button>
                </form>
            </div>
            
            <div class="direita">
                <h2>TAREFAS ATUAIS</h2>
                <div id="agenda">
                    <div id="tarefas_atuais">
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
